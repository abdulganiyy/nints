name: nints

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - "./docker/nginx/conf.d/default.dev.conf:/etc/nginx/conf.d/default.conf"
  postgres:
    image: postgres
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: my_database
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
  redis:
    image: redis:alpine
    container_name: dev_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass "my_password"
    restart: always

volumes:
  postgres_data:
  redis_data:
